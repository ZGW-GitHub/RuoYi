<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改设备信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-deviceInfo-edit" th:object="${deviceInfo}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">设备序列号：</label>
                    <div class="col-sm-8">
                        <input name="deviceSerial" th:field="*{deviceSerial}" class="form-control" type="text" maxlength="32" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">设备名称：</label>
                    <div class="col-sm-8">
                        <input name="deviceName" th:field="*{deviceName}" class="form-control" type="text" maxlength="32">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">IP：</label>
                    <div class="col-sm-8">
                        <div class="ip-input-group" style="display: flex; align-items: center;">
                            <input name="ip1" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px; background-color: #f5f5f5;" maxlength="3" readonly>
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip2" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px; background-color: #f5f5f5;" maxlength="3" readonly>
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip3" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px; background-color: #f5f5f5;" maxlength="3" readonly>
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip4" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center;" maxlength="3">
                        </div>
                        <input name="deviceIp" th:field="*{deviceIp}" type="hidden">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">端口：</label>
                    <div class="col-sm-8">
                        <input name="devicePort" th:field="*{devicePort}" class="form-control" type="number" min="1" max="65535">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "meeting/deviceInfo";
        $("#form-deviceInfo-edit").validate({
            focusCleanup: true
        });

        // IP输入框处理
        $(document).ready(function() {
            // 获取IP前缀配置并初始化IP输入框
            loadIpPrefixAndInitialize();

            // 限制输入只能是数字，只对第4段生效
            $('input[name="ip4"]').on('input', function() {
                var value = $(this).val();
                if (value > 255) {
                    $(this).val(255);
                }
                if (value < 0) {
                    $(this).val(0);
                }
                updateFullIP();
            });

            // 端口号验证
            $('input[name="devicePort"]').on('input', function() {
                var value = $(this).val();
                if (value > 65535) {
                    $(this).val(65535);
                }
                if (value < 1 && value !== '') {
                    $(this).val(1);
                }
            });

            // 更新隐藏的完整IP字段
            function updateFullIP() {
                var ip1 = $('input[name="ip1"]').val() || '0';
                var ip2 = $('input[name="ip2"]').val() || '0';
                var ip3 = $('input[name="ip3"]').val() || '0';
                var ip4 = $('input[name="ip4"]').val() || '0';
                $('input[name="deviceIp"]').val(ip1 + '.' + ip2 + '.' + ip3 + '.' + ip4);
            }

            // 加载IP前缀配置并初始化IP输入框
            function loadIpPrefixAndInitialize() {
                $.ajax({
                    url: prefix + "/commonIp",
                    type: "post",
                    dataType: "json",
                    success: function(result) {
                        var prefixIp1, prefixIp2, prefixIp3;
                        
                        if (result.code == web_status.SUCCESS && result.data && result.data.length >= 3) {
                            prefixIp1 = result.data[0] || '192';
                            prefixIp2 = result.data[1] || '168';
                            prefixIp3 = result.data[2] || '1';
                        } else {
                            // 默认值
                            prefixIp1 = '192';
                            prefixIp2 = '168';
                            prefixIp3 = '1';
                        }

                        // 设置前三段IP（从配置获取）
                        $('input[name="ip1"]').val(prefixIp1);
                        $('input[name="ip2"]').val(prefixIp2);
                        $('input[name="ip3"]').val(prefixIp3);

                        // 初始化第四段IP（从现有设备IP获取）
                        var deviceIp = $('input[name="deviceIp"]').val();
                        if (deviceIp) {
                            var ipParts = deviceIp.split('.');
                            if (ipParts.length === 4) {
                                $('input[name="ip4"]').val(ipParts[3]);
                            }
                        }

                        updateFullIP();
                    },
                    error: function() {
                        // 默认值
                        $('input[name="ip1"]').val('192');
                        $('input[name="ip2"]').val('168');
                        $('input[name="ip3"]').val('1');
                        
                        // 初始化第四段IP（从现有设备IP获取）
                        var deviceIp = $('input[name="deviceIp"]').val();
                        if (deviceIp) {
                            var ipParts = deviceIp.split('.');
                            if (ipParts.length === 4) {
                                $('input[name="ip4"]').val(ipParts[3]);
                            }
                        }

                        updateFullIP();
                    }
                });
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-deviceInfo-edit').serialize());
            }
        }
    </script>
</body>
</html>
