<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增设备信息')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-deviceInfo-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">设备序列号：</label>
                    <div class="col-sm-8">
                        <input name="deviceSerial" class="form-control" type="text" maxlength="32" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">设备名称：</label>
                    <div class="col-sm-8">
                        <input name="deviceName" class="form-control" type="text" maxlength="32">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">IP：</label>
                    <div class="col-sm-8">
                        <div class="ip-input-group" style="display: flex; align-items: center;">
                            <input name="ip1" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px;" maxlength="3">
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip2" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px;" maxlength="3">
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip3" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center; margin-right: 8px;" maxlength="3">
                            <span style="margin-right: 8px;">.</span>
                            <input name="ip4" class="form-control ip-part" type="number" min="0" max="255" style="width: 80px; text-align: center;" maxlength="3">
                        </div>
                        <input name="deviceIp" type="hidden">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">端口：</label>
                    <div class="col-sm-8">
                        <input name="devicePort" class="form-control" type="number" min="1" max="65535">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "meeting/deviceInfo"
        $("#form-deviceInfo-add").validate({
            focusCleanup: true
        });

        // IP输入框处理
        $(document).ready(function() {
            // 限制输入只能是数字
            $('.ip-part').on('input', function() {
                var value = $(this).val();
                if (value > 255) {
                    $(this).val(255);
                }
                if (value < 0) {
                    $(this).val(0);
                }
                updateFullIP();
            });

            // 端口号验证
            $('input[name="devicePort"]').on('input', function() {
                var value = $(this).val();
                if (value > 65535) {
                    $(this).val(65535);
                }
                if (value < 1 && value !== '') {
                    $(this).val(1);
                }
            });

            // 自动跳转到下一个输入框
            $('.ip-part').on('keyup', function(e) {
                var value = $(this).val();
                if (value.length === 3 || (e.keyCode === 190 || e.keyCode === 110)) { // 190是点号键码
                    var next = $(this).closest('.ip-input-group').find('.ip-part').eq($(this).closest('.ip-input-group').find('.ip-part').index(this) + 1);
                    if (next.length) {
                        next.focus();
                    }
                }
            });

            // 更新隐藏的完整IP字段
            function updateFullIP() {
                var ip1 = $('input[name="ip1"]').val() || '0';
                var ip2 = $('input[name="ip2"]').val() || '0';
                var ip3 = $('input[name="ip3"]').val() || '0';
                var ip4 = $('input[name="ip4"]').val() || '0';
                $('input[name="deviceIp"]').val(ip1 + '.' + ip2 + '.' + ip3 + '.' + ip4);
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-deviceInfo-add').serialize());
            }
        }
    </script>
</body>
</html>
