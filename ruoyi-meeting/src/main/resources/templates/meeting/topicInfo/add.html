<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增议题')" />
    <th:block th:include="include :: bootstrap-fileinput-css"/>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-topicInfo-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">标题：</label>
                    <div class="col-sm-8">
                        <input name="title" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报人：</label>
                    <div class="col-sm-8">
                        <input name="reportPeople" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报单位：</label>
                    <div class="col-sm-8">
                        <input name="reportUnit" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">议题文件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="fileInfo">
                        <div class="file-loading">
                            <input class="form-control file-upload" id="fileInfo" name="file" type="file" multiple>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">附件：</label>
                    <div class="col-sm-8">
                        <input type="hidden" name="attachmentInfo">
                        <div class="file-loading">
                            <input class="form-control file-upload" id="attachmentInfo" name="file" type="file" multiple>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">序号：</label>
                    <div class="col-sm-8">
                        <input name="orderNo" class="form-control" type="text">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: bootstrap-fileinput-js"/>
    <script th:inline="javascript">
        var prefix = ctx + "meeting/topicInfo"
        $("#form-topicInfo-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/add", $('#form-topicInfo-add').serialize());
            }
        }

        $(".file-upload").fileinput({
            uploadUrl: ctx + 'common/upload',
            maxFileCount: 10,
            autoReplace: false,
            showPreview: false,
            showUpload: false,
            allowedFileExtensions: ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'jpg', 'jpeg', 'png', 'gif']
        }).on('fileuploaded', function (event, data, previewId, index) {
            var currentValue = $("input[name='" + event.currentTarget.id + "']").val();
            var newUrl = data.response.url;
            if (currentValue) {
                $("input[name='" + event.currentTarget.id + "']").val(currentValue + ',' + newUrl);
            } else {
                $("input[name='" + event.currentTarget.id + "']").val(newUrl);
            }
        }).on('fileremoved', function (event, id, index) {
            // 当移除文件时，需要从隐藏字段中移除对应的URL
            var hiddenInput = $("input[name='" + event.currentTarget.id + "']");
            var currentValue = hiddenInput.val();
            if (currentValue) {
                var urls = currentValue.split(',');
                urls.splice(index, 1);
                hiddenInput.val(urls.join(','));
            }
        })
    </script>
</body>
</html>
