<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('新增议题')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-topicInfo-add">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">标题：</label>
                    <div class="col-sm-8">
                        <input name="title" class="form-control" type="text" required>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报人：</label>
                    <div class="col-sm-8">
                        <input name="reportPeople" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报单位：</label>
                    <div class="col-sm-8">
                        <input name="reportUnit" class="form-control" type="text">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">议题文件：</label>
                    <div class="col-sm-8">
                        <input class="form-control" id="fileInfo" name="fileInfoFiles" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.gif">
                        <div id="fileInfo-list" class="file-list" style="margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">附件：</label>
                    <div class="col-sm-8">
                        <input class="form-control" id="attachmentInfo" name="attachmentInfoFiles" type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.gif">
                        <div id="attachmentInfo-list" class="file-list" style="margin-top: 10px;"></div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">序号：</label>
                    <div class="col-sm-8">
                        <input name="orderNo" class="form-control" type="text">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var prefix = ctx + "meeting/topicInfo"
        $("#form-topicInfo-add").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                // 使用FormData提交包含文件的表单
                var formData = new FormData(document.getElementById('form-topicInfo-add'));
                
                $.ajax({
                    url: prefix + "/add",
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(result) {
                        $.operate.successCallback(result);
                    },
                    error: function() {
                        $.modal.alertError("系统错误");
                    }
                });
            }
        }

        // 监听文件选择事件
        $('#fileInfo, #attachmentInfo').on('change', function() {
            displayFileList(this);
        });

        // 显示文件列表
        function displayFileList(input) {
            var fileListDiv = $('#' + input.id + '-list');
            fileListDiv.empty();
            
            if (input.files && input.files.length > 0) {
                for (var i = 0; i < input.files.length; i++) {
                    var fileName = input.files[i].name;
                    var fileItem = $('<div class="file-item" style="margin: 5px 0; padding: 8px; background: #f5f5f5; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">' +
                        '<span class="file-name"><i class="fa fa-file-o" style="margin-right: 8px; color: #666;"></i>' + fileName + '</span>' +
                        '<button type="button" class="btn btn-xs btn-danger remove-file" data-input-id="' + input.id + '" data-file-index="' + i + '">删除</button>' +
                        '</div>');
                    fileListDiv.append(fileItem);
                }
            }
        }

        // 删除文件
        $(document).on('click', '.remove-file', function() {
            var button = $(this);
            var inputId = button.data('input-id');
            var fileIndex = button.data('file-index');
            var input = document.getElementById(inputId);
            
            // 创建新的文件列表（排除要删除的文件）
            var dt = new DataTransfer();
            for (var i = 0; i < input.files.length; i++) {
                if (i !== fileIndex) {
                    dt.items.add(input.files[i]);
                }
            }
            input.files = dt.files;
            
            // 重新显示文件列表
            displayFileList(input);
        });
    </script>
</body>
</html>
