<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('议题列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>标题：</label>
                                <input type="text" name="title"/>
                            </li>
                            <!-- <li> -->
                            <!--     <label>状态：</label> -->
                            <!--     <select name="topicStatus" th:with="type=${@dict.getType('bus_meeting_topic_status')}"> -->
                            <!--         <option value="">所有</option> -->
                            <!--         <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option> -->
                            <!--     </select> -->
                            <!-- </li> -->
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasRole="busMeeting_tipicSubmit" id="addBtn" style="display: none;">
                    <i class="fa fa-plus"></i> 新建议题
                </a>
                <!-- <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="meeting:topicInfo"> -->
                <!--     <i class="fa fa-edit"></i> 修改 -->
                <!-- </a> -->
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasRole="busMeeting_tipicSubmit" id="removeBtn">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <!-- <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="meeting:topicInfo"> -->
                <!--     <i class="fa fa-download"></i> 导出 -->
                <!-- </a> -->
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var meetingAuditFlag = [[${@permission.hasAnyRoles('admin,busMeeting_topicAudit')}]];
        var meetingSubmitFlag = [[${@permission.hasRole('busMeeting_tipicSubmit')}]];
        // var meetingManageFlag = [[${@permission.hasRole('busMeeting_meetingManage')}]];
        var editFlag = [[${@permission.hasPermi('meeting:topicInfo:edit')}]];
        var removeFlag = [[${@permission.hasPermi('meeting:topicInfo:remove')}]];
        var topicTypeDatas = [[${@dict.getType('bus_meeting_topic_type')}]];
        var topicStatusDatas = [[${@dict.getType('bus_meeting_topic_status')}]];
        var prefix = ctx + "meeting/topicInfo";

        $(function() {
            // 获取URL参数
            function getUrlParam(name) {
                var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
                var r = window.location.search.substr(1).match(reg);
                if (r != null) return unescape(r[2]);
                return null;
            }
            
            // 获取topicStatus参数并设置到表单中
            var urlTopicStatus = getUrlParam('topicStatus');
            if (urlTopicStatus) {
                $('select[name="topicStatus"]').val(urlTopicStatus);
            }
            
            // 只有当urlTopicStatus为pending时才显示添加、删除按钮
            if (urlTopicStatus === 'pending') {
                $('#addBtn').show();
            }
            
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                detailUrl: prefix + "/detail/{id}",
                modalName: "议题",
                showToggle: false,
                showExport: false,
                showColumns: false,
                queryParams: function(params) {
                    var searchParams = $.table.queryParams(params);
                    // 如果URL中有topicStatus参数，添加到查询参数中
                    if (urlTopicStatus) {
                        searchParams.topicStatus = urlTopicStatus;
                    }
                    return searchParams;
                },
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'title',
                    title: '标题'
                },
                {
                    field: 'orderNo',
                    title: '序号',
                    align: 'center'
                },
                {
                    field: 'reportPeople',
                    title: '汇报人',
                    align: 'center'
                },
                {
                    field: 'reportUnit',
                    title: '汇报单位',
                    align: 'center'
                },
                {
                    field: 'topicStatus',
                    title: '状态',
                    align: 'center',
                    formatter: function(value, row, index) {
                        return $.table.selectDictLabel(topicStatusDatas, value);
                    }
                },
                {
                    field: 'createBy',
                    title: '创建人',
                    align: 'center'
                },
                {
                    field: 'createTime',
                    title: '创建时间',
                    align: 'center'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-primary btn-xs ' + '" href="javascript:void(0)" onclick="$.operate.detail(\'' + row.id + '\')"><i class="fa fa-eye"></i>详情</a> ');
                        if (row.topicStatus === 'pending') {
                            actions.push('<a class="btn btn-success btn-xs ' + meetingSubmitFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                            actions.push('<a class="btn btn-success btn-xs ' + meetingAuditFlag + '" href="javascript:void(0)" onclick="auditTopic(\'' + row.id + '\', true)"><i class="fa fa-check"></i>通过</a> ');
                            actions.push('<a class="btn btn-warning btn-xs ' + meetingAuditFlag + '" href="javascript:void(0)" onclick="auditTopic(\'' + row.id + '\', false)"><i class="fa fa-times"></i>驳回</a> ');
                        }
                        actions.push('<a class="btn btn-info btn-xs ' + meetingSubmitFlag + '" href="javascript:void(0)" onclick="downloadTopicFiles(\'' + row.id + '\')"><i class="fa fa-download"></i>下载议题文件</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + meetingSubmitFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');

                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        // 下载议题文件
        function downloadTopicFiles(topicId) {
            // $.modal.loading("正在打包下载，请稍候...");
            window.location.href = prefix + "/download/" + topicId;
            // setTimeout(function() {
            //     $.modal.closeLoading();
            // }, 2000);
        }

        // 审核议题
        function auditTopic(topicId, auditResult) {
            if (auditResult) {
                // 通过审核
                $.modal.confirm("确认通过该议题吗？", function() {
                    $.ajax({
                        url: prefix + "/audit",
                        type: "POST",
                        data: {
                            id: topicId,
                            auditResult: true,
                            auditRemark: ""
                        },
                        success: function(result) {
                            if (result.code === 0) {
                                $.modal.msgSuccess("审核通过成功");
                                $("#bootstrap-table").bootstrapTable('refresh');
                            } else {
                                $.modal.msgError(result.msg);
                            }
                        },
                        error: function() {
                            $.modal.msgError("审核失败，请重试");
                        }
                    });
                });
            } else {
                // 驳回审核 - 使用layer弹窗
                layer.prompt({
                    title: '请输入驳回原因（可选）',
                    formType: 2, // 多行文本框
                    area: ['400px', '200px'],
                    value: '',
                    maxlength: 100,
                    // placeholder: '请输入驳回原因（可选）'
                }, function(value, index) {
                    $.ajax({
                        url: prefix + "/audit",
                        type: "POST",
                        data: {
                            id: topicId,
                            auditResult: false,
                            auditRemark: value || ""
                        },
                        success: function(result) {
                            if (result.code === 0) {
                                $.modal.msgSuccess("驳回成功");
                                $("#bootstrap-table").bootstrapTable('refresh');
                                layer.close(index);
                            } else {
                                $.modal.msgError(result.msg);
                            }
                        },
                        error: function() {
                            $.modal.msgError("驳回失败，请重试");
                        }
                    });
                });
            }
        }
    </script>
</body>
</html>
