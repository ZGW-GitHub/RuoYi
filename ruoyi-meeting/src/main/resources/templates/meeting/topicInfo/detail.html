<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('查看议题')" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <div class="form-horizontal m" th:object="${topicInfo}">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">标题：</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:value="*{title}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">序号：</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:value="*{orderNo}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报人：</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:value="*{reportPeople}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">汇报单位：</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:value="*{reportUnit}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">状态：</label>
                    <div class="col-sm-8">
                        <div class="form-control" style="background-color: #f5f5f5; border: 1px solid #ccc; height: auto; padding: 6px 12px;">
                            <span id="topicStatusLabel" class="label"></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">议题文件：</label>
                    <div class="col-sm-8">
                        <div class="form-control" style="background-color: #f5f5f5; height: auto; min-height: 34px; padding: 6px 12px;">
                            <div id="fileInfo-existing" class="existing-files"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">附件：</label>
                    <div class="col-sm-8">
                        <div class="form-control" style="background-color: #f5f5f5; height: auto; min-height: 34px; padding: 6px 12px;">
                            <div id="attachmentInfo-existing" class="existing-files"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">创建时间：</label>
                    <div class="col-sm-8">
                        <input class="form-control" type="text" th:value="${#dates.format(topicInfo.createTime, 'yyyy-MM-dd HH:mm:ss')}" readonly style="background-color: #f5f5f5;">
                    </div>
                </div>
            </div>
            <!-- 驳回原因 - 仅在状态为 rejected 时显示 -->
            <div class="col-xs-12" id="auditRemarkSection" style="display: none;">
                <div class="form-group">
                    <label class="col-sm-3 control-label">驳回原因：</label>
                    <div class="col-sm-8">
                        <textarea class="form-control" id="auditRemarkText" readonly style="background-color: #f5f5f5; resize: none; min-height: 80px;"></textarea>
                    </div>
                </div>
            </div>
            <!-- <div class="col-xs-12"> -->
            <!--     <div class="form-group"> -->
            <!--         <div class="col-sm-8 col-sm-offset-3"> -->
            <!--             <button type="button" class="btn btn-default" onclick="$.modal.close()">关闭</button> -->
            <!--         </div> -->
            <!--     </div> -->
            <!-- </div> -->
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var existingFileInfo = /*[[${topicInfo.fileInfo}]]*/ '';
        var existingAttachmentInfo = /*[[${topicInfo.attachmentInfo}]]*/ '';
        var topicStatusDatas = [[${@dict.getType('bus_meeting_topic_status')}]];
        var currentTopicStatus = /*[[${topicInfo.topicStatus}]]*/ '';
        var meetingExtInfo = /*[[${topicInfo.meetingExtInfo}]]*/ null;
        
        // 显示现有文件
        function displayExistingFiles() {
            if (existingFileInfo) {
                try {
                    var fileInfoList = JSON.parse(existingFileInfo);
                    displayExistingFileList('fileInfo', fileInfoList);
                } catch (e) {
                    console.error('解析文件信息失败:', e);
                }
            }
            
            if (existingAttachmentInfo) {
                try {
                    var attachmentInfoList = JSON.parse(existingAttachmentInfo);
                    displayExistingFileList('attachmentInfo', attachmentInfoList);
                } catch (e) {
                    console.error('解析附件信息失败:', e);
                }
            }
        }

        function displayExistingFileList(fieldName, fileList) {
            var existingDiv = $('#' + fieldName + '-existing');
            existingDiv.empty();
            
            if (fileList && fileList.length > 0) {
                for (var i = 0; i < fileList.length; i++) {
                    var fileInfo = fileList[i];
                    var fileItem = $('<div class="file-item" style="margin: 2px 0; padding: 4px 0;">' +
                        '<span class="file-name"><i class="fa fa-file-o" style="margin-right: 8px; color: #666;"></i>' +
                        '<a href="' + fileInfo.fileUrl + '" target="_blank" style="color: #337ab7; text-decoration: none;">' + fileInfo.fileName + '</a></span>' +
                        '</div>');
                    existingDiv.append(fileItem);
                }
            } else {
                existingDiv.append('<span class="text-muted" style="font-style: italic;">暂无文件</span>');
            }
        }

        // 设置状态显示
        function setTopicStatusDisplay() {
            var statusLabel = $('#topicStatusLabel');
            if (currentTopicStatus && topicStatusDatas && topicStatusDatas.length > 0) {
                var statusDict = topicStatusDatas.find(function(item) {
                    return item.dictValue === currentTopicStatus;
                });
                
                if (statusDict) {
                    var labelClass = 'label-default';
                    // 根据状态值设置不同的样式
                    switch(currentTopicStatus) {
                        case '0':
                            labelClass = 'label-warning';
                            break;
                        case '1':
                            labelClass = 'label-success';
                            break;
                        case '2':
                            labelClass = 'label-danger';
                            break;
                    }
                    statusLabel.addClass('label ' + labelClass).text(statusDict.dictLabel);
                } else {
                    statusLabel.addClass('text-muted').text('未知状态');
                }
            } else {
                statusLabel.addClass('text-muted').text('未设置');
            }
        }

        // 显示驳回原因
        function displayAuditRemark() {
            // 只有当状态为 rejected 时才显示驳回原因
            if (currentTopicStatus === 'rejected') {
                var auditRemarkText = $('#auditRemarkText');
                var auditRemarkSection = $('#auditRemarkSection');

                if (meetingExtInfo && meetingExtInfo.auditRemark) {
                    auditRemarkText.val(meetingExtInfo.auditRemark);
                } else {
                    auditRemarkText.val('');
                }

                auditRemarkSection.show();
            }
        }

        // 页面加载完成后显示现有文件和状态
        $(document).ready(function() {
            displayExistingFiles();
            setTopicStatusDisplay();
            displayAuditRemark();
        });
    </script>
</body>
</html>
