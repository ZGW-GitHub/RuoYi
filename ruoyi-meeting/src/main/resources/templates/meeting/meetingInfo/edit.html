<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改会议信息')" />
    <th:block th:include="include :: datetimepicker-css" />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        .sortable-ghost {
            opacity: 0.4;
        }
        .sortable-chosen {
            background: #e3f2fd !important;
        }
        .sortable-drag {
            background: #fff !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
        }
        .topic-item:hover {
            background: #e8f4fd !important;
        }
        .drag-handle:hover {
            color: #333 !important;
        }
    </style>
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-meetingInfo-edit" th:object="${meetingInfo}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">标题：</label>
                    <div class="col-sm-8">
                        <input name="title" th:field="*{title}" class="form-control" type="text" required maxlength="30" id="meetingTitle">
                        <small class="text-muted" id="titleLengthTip" style="display: none;"></small>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">会议时间：</label>
                    <div class="col-sm-8">
                        <div class="input-group date">
                            <input name="meetingTime" th:field="*{meetingTime}" class="form-control" placeholder="yyyy-MM-dd HH:mm" type="text" required>
                            <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">主持人：</label>
                    <div class="col-sm-8">
                        <input name="meetingHost" th:field="*{meetingHost}" class="form-control" type="text" maxlength="30" id="meetingHost">
                        <small class="text-muted" id="hostLengthTip" style="display: none;"></small>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">序号：</label>
                    <div class="col-sm-8">
                        <input name="orderNo" th:field="*{orderNo}" class="form-control" type="number" min="1" step="1" placeholder="默认为1">
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">出席人员：</label>
                    <div class="col-sm-8">
                        <textarea name="participantPeople" th:field="*{participantPeople}" class="form-control" rows="3" maxlength="200" id="participantPeople"></textarea>
                        <small class="text-muted" id="participantLengthTip" style="display: none;"></small>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">列席人员：</label>
                    <div class="col-sm-8">
                        <textarea name="attendancePeople" th:field="*{attendancePeople}" class="form-control" rows="3" maxlength="200" id="attendancePeople"></textarea>
                        <small class="text-muted" id="attendanceLengthTip" style="display: none;"></small>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">关联议题：</label>
                    <div class="col-sm-8">
                        <div class="input-group" style="margin-bottom: 5px;">
                            <input type="text" id="selectedTopicsDisplay" class="form-control" readonly placeholder="点击选择关联议题">
                            <span class="input-group-btn">
                                <button type="button" class="btn btn-primary" style="height: 31px;" onclick="openTopicSelector()">
                                    <i class="fa fa-search"></i> 选择议题
                                </button>
                            </span>
                        </div>
                        <input type="hidden" id="selectedTopicIds" name="selectedTopicIds" value="">
                        <div id="selectedTopicsList" class="mt-2">
                            <div class="selected-topics-container" style="min-height: 40px; border: 1px dashed #ddd; border-radius: 4px; padding: 8px;">
                                <div class="empty-tip text-muted" style="text-align: center; padding: 10px;">暂无关联议题，点击上方按钮选择</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: datetimepicker-js" />
    <script th:inline="javascript">
        var prefix = ctx + "meeting/meetingInfo";
        var selectedTopics = []; // 存储已选择的议题
        
        $(function() {
            $("#form-meetingInfo-edit").validate({
                focusCleanup: true
            });

            $("input[name='meetingTime']").datetimepicker({
                format: "yyyy-mm-dd hh:ii",
                minView: "hour",
                autoclose: true,
                todayBtn: true
            });

            setupLengthMonitoring();
            
            // 页面加载时，如果有已关联的议题，需要显示出来
            var meetingId = $('input[name="id"]').val();
            if (meetingId) {
                loadRelatedTopics(meetingId);
            }
        });

        function submitHandler() {
            if ($.validate.form()) {
                // 更新选中的议题ID到隐藏字段
                var topicIds = selectedTopics.map(function(topic) { return topic.id; }).join(',');
                $('#selectedTopicIds').val(topicIds);
                
                // 提交表单
                $.operate.save(prefix + "/edit", $('#form-meetingInfo-edit').serialize());
            }
        }

        // 打开议题选择器
        function openTopicSelector() {
            var index = layer.open({
                type: 2,
                title: '选择关联议题',
                shadeClose: true,
                shade: 0.8,
                area: ['80%', '70%'],
                content: ctx + 'meeting/topicInfo/selector',
                btn: ['确定', '取消'],
                yes: function(index, layero) {
                    // 获取选中的议题
                    var iframeWin = window[layero.find('iframe')[0]['name']];
                    var selectedData = iframeWin.getSelectedTopics();
                    if (selectedData && selectedData.length > 0) {
                        selectedTopics = selectedData;
                        updateSelectedTopicsDisplay();
                    }
                    layer.close(index);
                },
                cancel: function(index) {
                    layer.close(index);
                }
            });
        }

        // 更新已选择议题的显示
        function updateSelectedTopicsDisplay() {
            var displayText = selectedTopics.map(function(topic) { return topic.title; }).join(', ');
            $('#selectedTopicsDisplay').val(displayText);
            
            var container = $('#selectedTopicsList .selected-topics-container');
            if (selectedTopics.length === 0) {
                container.html('<div class="empty-tip text-muted" style="text-align: center; padding: 10px;">暂无关联议题，点击上方按钮选择</div>');
            } else {
                var listHtml = '';
                selectedTopics.forEach(function(topic, index) {
                    listHtml += '<div class="topic-item" data-index="' + index + '" style="display: block; margin: 3px 0; padding: 5px 10px; background: #f0f9ff; border: 1px solid #b3d8ff; border-radius: 4px; cursor: move; position: relative;">' +
                               '<span class="drag-handle" style="margin-right: 5px; color: #999; cursor: move;">⋮⋮</span>' +
                               '<span class="topic-title">' + topic.title + '</span>' +
                               '<span class="order-number" style="margin-left: 5px; color: #666; font-size: 12px;">#' + (index + 1) + '</span>' +
                               '<i class="fa fa-times remove-topic" data-index="' + index + '" style="margin-left: 8px; cursor: pointer; color: #999;" title="移除"></i>' +
                               '</div>';
                });
                container.html(listHtml);
                
                // 绑定移除事件
                container.find('.remove-topic').click(function() {
                    var index = $(this).data('index');
                    removeSelectedTopic(index);
                });
                
                // 初始化拖拽排序
                initSortable();
            }
            
            // 更新隐藏字段
            var topicIds = selectedTopics.map(function(topic) { return topic.id; }).join(',');
            $('#selectedTopicIds').val(topicIds);
        }

        // 初始化拖拽排序
        function initSortable() {
            var container = document.querySelector('#selectedTopicsList .selected-topics-container');
            if (container && typeof Sortable !== 'undefined') {
                Sortable.create(container, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    handle: '.drag-handle',
                    onEnd: function(evt) {
                        // 更新数组顺序
                        var oldIndex = evt.oldIndex;
                        var newIndex = evt.newIndex;
                        
                        if (oldIndex !== newIndex) {
                            var movedItem = selectedTopics.splice(oldIndex, 1)[0];
                            selectedTopics.splice(newIndex, 0, movedItem);
                            updateSelectedTopicsDisplay();
                        }
                    }
                });
            }
        }

        // 移除已选择的议题
        function removeSelectedTopic(index) {
            selectedTopics.splice(index, 1);
            updateSelectedTopicsDisplay();
        }

        // 输入长度监控功能
        function setupLengthMonitoring() {
            // 监控标题输入
            $('#meetingTitle').on('input', function() {
                var current = $(this).val().length;
                var max = 30;
                var tip = $('#titleLengthTip');
                
                if (current >= max * 0.8) { // 当达到80%长度时开始提示
                    tip.text('已输入 ' + current + '/' + max + ' 个字符');
                    tip.show();
                    if (current >= max) {
                        tip.addClass('text-danger').removeClass('text-warning');
                    } else {
                        tip.addClass('text-warning').removeClass('text-danger');
                    }
                } else {
                    tip.hide();
                }
            });

            // 监控主持人输入
            $('#meetingHost').on('input', function() {
                var current = $(this).val().length;
                var max = 30;
                var tip = $('#hostLengthTip');
                
                if (current >= max * 0.8) {
                    tip.text('已输入 ' + current + '/' + max + ' 个字符');
                    tip.show();
                    if (current >= max) {
                        tip.addClass('text-danger').removeClass('text-warning');
                    } else {
                        tip.addClass('text-warning').removeClass('text-danger');
                    }
                } else {
                    tip.hide();
                }
            });

            // 监控出席人员输入
            $('#participantPeople').on('input', function() {
                var current = $(this).val().length;
                var max = 200;
                var tip = $('#participantLengthTip');
                
                if (current >= max * 0.8) {
                    tip.text('已输入 ' + current + '/' + max + ' 个字符');
                    tip.show();
                    if (current >= max) {
                        tip.addClass('text-danger').removeClass('text-warning');
                    } else {
                        tip.addClass('text-warning').removeClass('text-danger');
                    }
                } else {
                    tip.hide();
                }
            });

            // 监控列席人员输入
            $('#attendancePeople').on('input', function() {
                var current = $(this).val().length;
                var max = 200;
                var tip = $('#attendanceLengthTip');
                
                if (current >= max * 0.8) {
                    tip.text('已输入 ' + current + '/' + max + ' 个字符');
                    tip.show();
                    if (current >= max) {
                        tip.addClass('text-danger').removeClass('text-warning');
                    } else {
                        tip.addClass('text-warning').removeClass('text-danger');
                    }
                } else {
                    tip.hide();
                }
            });
        }

        // 页面加载完成后初始化长度监控
        $(document).ready(function() {
            setupLengthMonitoring();
        });

        // 页面加载时，如果有已关联的议题，需要显示出来
        $(document).ready(function() {
            // 这里可以通过AJAX获取当前会议已关联的议题
            var meetingId = $('input[name="id"]').val();
            if (meetingId) {
                loadRelatedTopics(meetingId);
            }
        });

        // 加载已关联的议题
        function loadRelatedTopics(meetingId) {
            // 确保meetingId作为字符串处理，避免精度丢失
            var meetingIdStr = String(meetingId);
            $.ajax({
                url: prefix + "/getRelatedTopics",
                type: "GET",
                data: { meetingId: meetingIdStr },
                success: function(result) {
                    if (result.code === 0 && result.data && result.data.length > 0) {
                        selectedTopics = result.data;
                        updateSelectedTopicsDisplay();
                    }
                },
                error: function() {
                    console.log("加载关联议题失败");
                }
            });
        }
    </script>
</body>
</html>
