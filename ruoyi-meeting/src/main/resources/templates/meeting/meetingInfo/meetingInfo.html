<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('会议信息列表')" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>标题：</label>
                                <input type="text" name="title"/>
                            </li>
                            <!-- <li> -->
                            <!--     <label>状态：</label> -->
                            <!--     <select name="meetingStatus" th:with="type=${@dict.getType('bus_meeting_meeting_status')}"> -->
                            <!--         <option value="">所有</option> -->
                            <!--         <option th:each="dict : ${type}" th:text="${dict.dictLabel}" th:value="${dict.dictValue}"></option> -->
                            <!--     </select> -->
                            <!-- </li> -->
                            <li class="select-time">
                                <label>会议时间：</label>
                                <input type="text" class="time-input" id="startTime" placeholder="开始时间" name="params[beginMeetingTime]"/>
                                <span>-</span>
                                <input type="text" class="time-input" id="endTime" placeholder="结束时间" name="params[endMeetingTime]"/>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasRole="busMeeting_tipicSubmit">
                    <i class="fa fa-plus"></i> 新建会议
                </a>
                <!-- <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="meeting:meetingInfo:edit"> -->
                <!--     <i class="fa fa-edit"></i> 修改 -->
                <!-- </a> -->
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasRole="busMeeting_tipicSubmit">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="clearTabletData()" shiro:hasRole="busMeeting_meetingManage">
                    <i class="fa fa-trash-o"></i> 清除平板数据
                </a>
                <!-- <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="meeting:meetingInfo:export"> -->
                <!--     <i class="fa fa-download"></i> 导出 -->
                <!-- </a> -->
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <script th:inline="javascript">
        var meetingAuditFlag = [[${@permission.hasAnyRoles('admin,busMeeting_topicAudit')}]];
        var meetingSubmitFlag = [[${@permission.hasAnyRoles('admin,busMeeting_tipicSubmit,busMeeting_meetingManage')}]];
        var editFlag = [[${@permission.hasPermi('meeting:meetingInfo:edit')}]];
        var removeFlag = [[${@permission.hasPermi('meeting:meetingInfo:remove')}]];
        var meetingTypeDatas = [[${@dict.getType('bus_meeting_meeting_type')}]];
        var meetingStatusDatas = [[${@dict.getType('bus_meeting_meeting_status')}]];
        var prefix = ctx + "meeting/meetingInfo";

        $(function() {
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "会议",
                showToggle: false,
                showExport: false,
                showColumns: false,
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: 'id',
                    visible: false
                },
                {
                    field: 'title',
                    title: '标题'
                },
                {
                    field: 'meetingStatus',
                    title: '状态',
                    visible: false,
                    formatter: function(value, row, index) {
                       return $.table.selectDictLabel(meetingStatusDatas, value);
                    }
                },
                {
                    field: 'meetingTime',
                    title: '会议时间'
                },
                {
                    field: 'meetingHost',
                    title: '主持人'
                },
                {
                    field: 'orderNo',
                    title: '序号'
                },
                {
                    field: 'topicCount',
                    title: '关联议题',
                    align: 'center',
                    formatter: function(value, row, index) {
                        const count = value || 0;
                        if (count > 0) {
                            return '<span class="badge badge-info">' + count + ' 个议题</span>';
                        } else {
                            return '<span class="text-muted">无</span>';
                        }
                    }
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        const actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + meetingSubmitFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        if (row.topicCount && row.topicCount > 0) {
                            actions.push('<a class="btn btn-info btn-xs" href="javascript:void(0)" onclick="viewRelatedTopics(\'' + row.id + '\', \'' + row.title + '\')"><i class="fa fa-list"></i> 查看议题</a> ');
                        }
                        actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="syncToDevice(\'' + row.id + '\')"><i class="fa fa-send"></i> 同步到设备</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + meetingSubmitFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });

        // 查看关联议题
        function viewRelatedTopics(meetingId, meetingTitle) {
            // 确保meetingId作为字符串处理，避免精度丢失
            var meetingIdStr = String(meetingId);
            var index = layer.open({
                type: 2,
                title: '会议关联议题 - ' + meetingTitle,
                shadeClose: true,
                shade: 0.8,
                area: ['80%', '70%'],
                content: prefix + "/relatedTopics/" + meetingIdStr,
                btn: ['关闭'],
                yes: function(index) {
                    layer.close(index);
                }
            });
        }

        // 同步到设备
        function syncToDevice(meetingId) {
            layer.confirm('确认要将此会议同步到设备吗？', {
                icon: 3,
                title: '提示'
            }, function(index) {
                $.ajax({
                    url: ctx + 'transmit/meeting',
                    type: 'POST',
                    data: {
                        meetingId: meetingId
                    },
                    success: function(result) {
                        if (result.code == web_status.SUCCESS) {
                            layer.alert(result.msg, {
                                icon: 1,
                                title: '同步成功'
                            });
                        } else {
                            layer.alert(result.msg, {
                                icon: 2,
                                title: '同步失败'
                            });
                        }
                    },
                    error: function() {
                        layer.alert("同步失败，请稍后重试", {
                            icon: 2,
                            title: '同步失败'
                        });
                    }
                });
                layer.close(index);
            });
        }

        // 清除平板数据
        function clearTabletData() {
            layer.confirm('确认要清除所有平板数据吗？此操作不可恢复！', {
                icon: 3,
                title: '警告'
            }, function(index) {
                $.ajax({
                    url: ctx + 'transmit/clearData',
                    type: 'POST',
                    success: function(result) {
                        if (result.code == web_status.SUCCESS) {
                            layer.alert(result.msg, {
                                icon: 1,
                                title: '清除成功'
                            });
                        } else {
                            layer.alert(result.msg, {
                                icon: 2,
                                title: '清除失败'
                            });
                        }
                    },
                    error: function() {
                        layer.alert("清除失败，请稍后重试", {
                            icon: 2,
                            title: '清除失败'
                        });
                    }
                });
                layer.close(index);
            });
        }
    </script>
</body>
</html>
